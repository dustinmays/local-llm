min_version = "2026.7.0"

[tools]
python = "3.13.14"
node = "24.19.0"
pnpm = "11.22.0"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install the pinned local MLX environment on this Mac"
run = "./cluster/bin/bootstrap"

[tasks."cluster:init"]
description = "Create the controller's gitignored cluster configuration"
run = "./cluster/bin/init-config"

[tasks."cluster:ssh-setup"]
description = "Install a dedicated passwordless SSH key on the worker"
run = "./cluster/bin/ssh-setup"

[tasks."cluster:worker-setup"]
description = "Install dependencies from the worker's existing repository clone"
run = "./cluster/bin/worker-setup"

[tasks."model:download-fast"]
description = "Download the fast profile on this Mac only"
run = "./cluster/bin/download-model --fast"

[tasks."model:download-overnight"]
description = "Download the overnight profile on this Mac only"
run = "./cluster/bin/download-model --overnight"

[tasks."model:download-test"]
description = "Download the diagnostic profile on this Mac only"
run = "./cluster/bin/download-model --test"

[tasks."model:download-all"]
description = "Download fast and overnight profiles on this Mac only"
run = "./cluster/bin/download-model --fast && ./cluster/bin/download-model --overnight"

[tasks."model:remove-llama"]
description = "Interactively remove the diagnostic and 70B Llama caches on this Mac"
run = "./cluster/bin/remove-llama-models"

[tasks."cluster:check"]
description = "Validate both Macs for the fast profile"
run = "./cluster/bin/check --fast"

[tasks."cluster:check-overnight"]
description = "Validate both Macs for the overnight profile"
run = "./cluster/bin/check --overnight"

[tasks."cluster:check-test"]
description = "Validate both Macs for the diagnostic profile"
run = "./cluster/bin/check --test"

[tasks."cluster:topology"]
description = "Inspect the Thunderbolt topology without changing interfaces"
run = "./cluster/bin/topology"

[tasks."cluster:configure"]
description = "Configure Thunderbolt networking and generate the MLX hostfile"
run = "./cluster/bin/configure"

[tasks."cluster:smoke"]
description = "Run a two-rank MLX collective smoke test"
run = "./cluster/bin/smoke"

[tasks."cluster:start"]
description = "Start the fast profile across both Macs"
run = "./cluster/bin/start --fast"

[tasks."cluster:start-fast"]
description = "Start the fast profile across both Macs"
run = "./cluster/bin/start --fast"

[tasks."cluster:start-overnight"]
description = "Start the overnight profile across both Macs"
run = "./cluster/bin/start --overnight"

[tasks."cluster:start-test"]
description = "Start the small known-shardable distributed test model"
run = "./cluster/bin/start --test"

[tasks."cluster:stop"]
description = "Stop the distributed MLX server and both ranks"
run = "./cluster/bin/stop"

[tasks."cluster:status"]
description = "Show launcher, API, model, and worker status"
run = "./cluster/bin/status"

[tasks."cluster:logs"]
description = "Follow the distributed server log"
run = "./cluster/bin/logs"

[tasks."cluster:test"]
description = "Send a small OpenAI-compatible request to the cluster"
run = "./cluster/bin/api-test"

[tasks."cluster:test-tools"]
description = "Require a structured function call from the active model"
run = "./cluster/bin/tool-test"

[tasks."cluster:benchmark"]
description = "Measure uncached prompt and generation latency"
run = "./cluster/bin/benchmark"

[tasks."opencode:install"]
description = "Back up and install the OpenCode config with local and cluster providers"
run = "./cluster/bin/install-opencode"

[tasks."repo:context"]
description = "Verify which Git worktree is being operated on (read-only)"
run = "./cluster/bin/repo-context"

[tasks."repo:check-shell"]
description = "Check Bash syntax of cluster scripts"
run = '''
for f in cluster/bin/*; do bash -n "$f" || exit 1; done
for f in cluster/lib/*.sh; do bash -n "$f" || exit 1; done
echo "All shell scripts pass syntax check"
'''

[tasks."delegate:install"]
description = "Install the pinned local-mlx-delegate dependencies"
run = "pnpm install --frozen-lockfile"

[tasks."delegate:build"]
description = "Compile local-mlx-delegate"
run = "pnpm build"

[tasks."delegate:format-check"]
description = "Check local-mlx-delegate formatting"
run = "pnpm format:check"

[tasks."delegate:lint"]
description = "Lint local-mlx-delegate"
run = "pnpm lint"

[tasks."delegate:typecheck"]
description = "Type-check local-mlx-delegate and its tests"
run = "pnpm typecheck && pnpm test:typecheck"

[tasks."delegate:test-offline"]
description = "Run fake-endpoint local-mlx-delegate tests"
run = "pnpm test:offline"

[tasks."delegate:test-protocol"]
description = "Run local-mlx-delegate MCP protocol tests"
run = "pnpm test:protocol"

[tasks."delegate:host-smoke"]
description = "Check installed host discovery and invoke status through the configured stdio command"
run = "pnpm test:host-smoke"

[tasks."delegate:status"]
description = "Inspect configured local inference backends (read-only)"
run = "pnpm status"

[tasks."delegate:doctor"]
description = "Run read-only local-mlx-delegate diagnostics"
run = "pnpm doctor"

[tasks."delegate:consult"]
description = "Run a bounded read-only local LLM consultation"
run = "node dist/cli.js delegate"

[tasks."delegate:leases"]
description = "Inspect shared local-mlx-delegate leases and wait tickets"
run = "node dist/cli.js leases"

[tasks."delegate:configure"]
description = "Preview or apply one project-local host MCP configuration"
run = "node dist/cli.js configure"

[tasks."delegate:check"]
description = "Run all offline local-mlx-delegate acceptance checks"
run = "pnpm check"
